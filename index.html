<!DOCTYPE html>
<html>
<head>
    <title>Advanced Calculator | Pro App</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1e1e2f;
        }

        .calculator {
            background: #2c2c3c;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px black;
        }

        /* ⭐ Title */
        .title {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: right;
            padding: 5px;
        }

        button {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        .num { background: #444; color: white; }
        .op { background: #ff9500; color: white; }
        .equal { background: #28a745; color: white; width: 130px; }
        .clear { background: #dc3545; color: white; }
    </style>
</head>

<body>

<div class="calculator">

    <!-- ⭐ Added Title -->
    <h2 class="title">Advanced Calculator</h2>

    <input type="text" id="display" readonly>

    <br>

    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="op" onclick="backspace()">⌫</button>
    <button class="op" onclick="append('/')">/</button>
    <button class="op" onclick="append('*')">*</button>

    <br>

    <button class="num" onclick="append('7')">7</button>
    <button class="num" onclick="append('8')">8</button>
    <button class="num" onclick="append('9')">9</button>
    <button class="op" onclick="append('-')">-</button>

    <br>

    <button class="num" onclick="append('4')">4</button>
    <button class="num" onclick="append('5')">5</button>
    <button class="num" onclick="append('6')">6</button>
    <button class="op" onclick="append('+')">+</button>

    <br>

    <button class="num" onclick="append('1')">1</button>
    <button class="num" onclick="append('2')">2</button>
    <button class="num" onclick="append('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>

    <br>

    <button class="num" onclick="append('0')">0</button>
    <button class="num" onclick="append('.')">.</button>

</div>

<script>
function append(value) {
    document.getElementById("display").value += value;
}

function clearDisplay() {
    document.getElementById("display").value = "";
}

function backspace() {
    let val = document.getElementById("display").value;
    document.getElementById("display").value = val.slice(0, -1);
}

function calculate() {
    try {
        document.getElementById("display").value =
            eval(document.getElementById("display").value);
    } catch {
        document.getElementById("display").value = "Error";
    }
}

// Keyboard support
document.addEventListener("keydown", function(event) {
    let key = event.key;

    if (!isNaN(key) || "+-*/.".includes(key)) {
        append(key);
    } else if (key === "Enter") {
        calculate();
    } else if (key === "Backspace") {
        backspace();
    } else if (key.toLowerCase() === "c") {
        clearDisplay();
    }
});
</script>

</body>
</html>
